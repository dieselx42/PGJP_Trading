[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sol-futures-trading-bot"
version = "0.1.0"
description = "Automated CME Solana futures trading system (infrastructure phase)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Runtime dependencies are intentionally EMPTY.
#
# In DISABLED and MOCK modes the application runs on the Python standard library
# only. This keeps the deployed attack surface minimal and makes the safety
# critical code path easy to audit.
#
# The Interactive Brokers adapter is an OPTIONAL extra (see [project.optional-dependencies]).
# See docs/IBKR_API_NOTES.md for why it is optional.
dependencies = []

[project.optional-dependencies]
# Interactive Brokers TWS API.
#
# NOTE: Interactive Brokers does not publish `ibapi` to PyPI themselves; the
# canonical distribution is the TWS API installer from interactivebrokers.github.io.
# Installing this extra pulls a third-party redistribution of the official source.
# READ docs/IBKR_API_NOTES.md BEFORE ENABLING THIS.
ibkr = ["ibapi>=10.30.1"]

dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
solbot = "app.main:main"
solbot-admin = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # comprehensions
  "UP",  # pyupgrade
  "SIM", # simplify
  "RUF", # ruff specific
  "DTZ", # flake8-datetimez -- naive datetimes are banned in this project
  "S",   # bandit
  "T20", # no print() in application code
  "PTH", # prefer pathlib
  "BLE", # blind `except Exception` must be justified with an explicit noqa
  "PLC0415", # imports belong at module top unless deliberately deferred
  "N",   # naming (ibapi callbacks are the documented exception)
]
ignore = [
  "S101",  # assert -- allowed (used in tests and internal invariants)
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
# ibapi fixes the names of its EWrapper callbacks (reqId, orderId, accountSummary,
# ...). Renaming them would silently stop the library from calling them.
"app/broker/ibkr_broker.py" = ["N802", "N803"]
# Tests deliberately import locally (to keep a test self-contained), assert on
# naive datetimes being rejected, and reach into private members to drive the
# runtime step by step.
"tests/**" = ["S", "T20", "DTZ", "PTH", "PLC0415"]
"app/cli.py" = ["T20"]          # the operator CLI legitimately prints to stdout
"scripts/**" = ["T20", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
exclude = ["^build/", "^dist/"]

[[tool.mypy.overrides]]
module = "ibapi.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
  "safety: critical trading-safety tests that must never be skipped",
  "integration: tests that exercise multiple subsystems together",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
branch = true
source = ["app"]
